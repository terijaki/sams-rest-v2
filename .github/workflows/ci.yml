name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Check, test & pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "25"
          cache: true

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Pack
        run: vp pack

  api:
    name: Live SAMS API
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "25"
          cache: true

      - name: Live API tests
        env:
          SAMS_API_KEY: ${{ secrets.SAMS_API_KEY }}
        run: bun run test:api
