name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Check, test & pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "25"
          cache: true

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Pack
        run: vp pack

      - name: Audit production dependencies
        run: vp pm audit -- --prod
