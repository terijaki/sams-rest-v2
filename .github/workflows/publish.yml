name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  verify:
    name: "Test: verify"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "25"
          cache: true

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Pack
        run: vp pack

      - name: Live API tests
        env:
          SAMS_API_KEY: ${{ secrets.SAMS_API_KEY }}
        run: vp run test:api

  publish:
    name: "Release: publish"
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "25"
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "25"
          registry-url: https://registry.npmjs.org

      - name: Publish
        run: npm publish --access public --provenance

      - name: Create git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping tag creation."
            exit 0
          fi

          PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0] // empty' || true)
          NOTES_FILE=$(mktemp)

          if [ -n "$PR_JSON" ] && [ "$PR_JSON" != "null" ]; then
            PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
            PR_URL=$(echo "$PR_JSON" | jq -r '.html_url')
            SUMMARY=$(echo "$PR_JSON" | jq -r '.body // ""' | awk '/^## Summary/{f=1;next} /^## /{f=0} f')
            if [ -n "$SUMMARY" ]; then
              {
                echo "## $PR_TITLE"
                echo
                echo "$SUMMARY"
                echo
                echo "Merged in $PR_URL"
              } > "$NOTES_FILE"
              gh release create "$TAG" \
                --target "${{ github.sha }}" \
                --title "$TAG" \
                --notes-file "$NOTES_FILE"
              exit 0
            fi
          fi

          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes
