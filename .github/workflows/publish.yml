name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          registry-url: https://registry.npmjs.org

      - name: Verify
        run: vp check && vp test && vp pack

      - name: Live API tests
        env:
          SAMS_API_KEY: ${{ secrets.SAMS_API_KEY }}
        run: bun run test:api

      - name: Publish
        run: npm publish --access public --provenance

      - name: Create git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping tag creation."
            exit 0
          fi
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes "Published from merge ${{ github.sha }}"
