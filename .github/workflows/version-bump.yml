name: Version bump

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: version-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bump:
    name: "Release: version bump"
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "25"
          cache: true

      - name: Install
        run: vp install --frozen-lockfile

      - name: Skip if version already bumped above main
        id: check
        run: |
          git fetch origin main
          if git cat-file -e "origin/main:package.json" 2>/dev/null; then
            MAIN_VERSION=$(git show origin/main:package.json | node -pe "JSON.parse(require('fs').readFileSync(0)).version")
          else
            # First release: main has no package yet; any version on the PR is fine.
            MAIN_VERSION="0.0.0"
          fi
          HEAD_VERSION=$(node -pe "require('./package.json').version")
          echo "main_version=$MAIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "head_version=$HEAD_VERSION" >> "$GITHUB_OUTPUT"
          node -e "
            const main = process.argv[1].split('.').map(Number);
            const head = process.argv[2].split('.').map(Number);
            const cmp = (a, b) => {
              for (let i = 0; i < 3; i++) {
                if (a[i] !== b[i]) return a[i] - b[i];
              }
              return 0;
            };
            process.stdout.write(cmp(head, main) > 0 ? 'already_bumped' : 'needs_bump');
          " "$MAIN_VERSION" "$HEAD_VERSION" > /tmp/bump-state.txt
          echo "state=$(cat /tmp/bump-state.txt)" >> "$GITHUB_OUTPUT"

      - name: Detect package content changes
        if: steps.check.outputs.state == 'needs_bump'
        id: content
        run: |
          git diff --name-only origin/main...HEAD > /tmp/changed-paths.txt
          if git cat-file -e "origin/main:package.json" 2>/dev/null; then
            git show origin/main:package.json > /tmp/base-package.json
          else
            echo '{}' > /tmp/base-package.json
          fi
          cp package.json /tmp/head-package.json
          vp run release-needed -- /tmp/changed-paths.txt /tmp/base-package.json /tmp/head-package.json

      - name: Bump patch version
        if: steps.check.outputs.state == 'needs_bump' && steps.content.outputs.needed == 'true'
        run: |
          npm version patch --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): bump version for publish"
          git push origin HEAD:${{ github.head_ref }}
