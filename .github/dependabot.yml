version: 2

updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 3
    cooldown:
      default-days: 14
      semver-major-days: 60
      semver-minor-days: 30
    groups:
      security-all:
        applies-to: security-updates
        patterns:
          - "*"
      production:
        dependency-type: production
        update-types:
          - patch
          - minor
      dev-toolchain-patch:
        patterns:
          - "vite-plus"
          - "@voidzero-dev/*"
          - "typescript"
          - "@types/node"
        update-types:
          - patch
      dev-toolchain-minor:
        patterns:
          - "vite-plus"
          - "@voidzero-dev/*"
          - "typescript"
          - "@types/node"
        update-types:
          - minor
      dev-other:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: "@hey-api/openapi-ts"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: quarterly
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
      security-actions:
        applies-to: security-updates
        patterns:
          - "*"
